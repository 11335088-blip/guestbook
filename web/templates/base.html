<!DOCTYPE html>
<html lang="zh-hant">
<head>
    <title>留言板</title>
</head>
<body>
  <h1>留言板</h1>
  <div>
    <a href="/">首頁</a>
    <a href="{% url 'msg_create' %}">新增留言</a>
    {% if user.is_authenticated %}
      <form action="{% url 'logout' %}" method="post" style="display:inline;">
         {% csrf_token %}
         <button type="submit">登出</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">登入</a>
    {% endif %}
  </div>

    <footer>20607</footer>

  <div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
